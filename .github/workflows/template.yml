name: App checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24.22.3"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python3 -m pip install PyYAML==6.0.3
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Check, test and build the app
        run: pnpm run check && pnpm test && pnpm run build
